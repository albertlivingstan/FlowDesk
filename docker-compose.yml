services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowdesk
      POSTGRES_PASSWORD: flowdesk_dev_password
      POSTGRES_DB: flowdesk
    ports: ["127.0.0.1:5432:5432"]
    volumes: [flowdesk_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowdesk"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  flowdesk_data:
